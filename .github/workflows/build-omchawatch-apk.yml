name: Build OmchaWatch APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'OmchaWatch/www/**'
      - 'OmchaWatch/android/**'
      - 'OmchaWatch/package.json'
      - 'OmchaWatch/package-lock.json'
      - 'OmchaWatch/capacitor.config.json'
      - '.github/workflows/build-omchawatch-apk.yml'

permissions:
  contents: write   # requis pour publier/mettre à jour la Release ci-dessous

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: OmchaWatch/package-lock.json

      - name: Install dependencies
        working-directory: OmchaWatch
        run: npm ci

      - name: Install stable debug keystore
        # Même keystore de debug fixe que les autres builds (cf. commentaire
        # dans build-apk.yml) : signature stable d'un run à l'autre.
        run: |
          mkdir -p ~/.android
          cp .github/ci-debug.keystore ~/.android/debug.keystore

      - name: Sync Capacitor Android project
        working-directory: OmchaWatch
        run: npx cap sync android

      - name: Bump version (versionCode unique par build)
        # Android refuse d'installer une "mise à jour" dont le
        # versionCode est identique/inférieur à la version déjà en
        # place (INSTALL_FAILED_VERSION_DOWNGRADE, affiché comme un
        # générique "App non installée") — versionCode était figé à 1
        # sur tous les builds précédents. Désormais calé sur le numéro
        # de run GitHub Actions, toujours strictement croissant.
        working-directory: OmchaWatch/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }} (${GITHUB_SHA::7})\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: OmchaWatch/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmchaWatch-debug-apk
          path: OmchaWatch/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # #201 : lien de téléchargement fiable sur mobile — un artefact
      # GitHub Actions (ci-dessus) exige d'être connecté à GitHub ET
      # télécharge un .zip (le navigateur mobile ne le décompresse jamais
      # tout seul, l'utilisateur se retrouve avec un fichier qu'Android ne
      # sait pas installer directement) ; il expire aussi au bout de 30
      # jours. Une Release GitHub, elle, sert le .apk BRUT (pas de zip,
      # installable dès le téléchargement terminé) et ne périme jamais.
      # Tag toujours réécrit ("omchawatch-latest") : UN SEUL lien stable à
      # garder en favori, qui pointe toujours vers le dernier build — pas
      # besoin de rechercher un nouveau lien de run à chaque fois.
      - name: Publish/update the "latest" Release with the raw APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omchawatch-latest
          name: "OmchaWatch — dernière version (build ${{ github.run_number }})"
          body: |
            Build automatique le plus récent, depuis le commit ${{ github.sha }}.
            Télécharge directement le fichier `.apk` ci-dessous et installe-le
            (Android demandera peut-être d'autoriser "Sources inconnues" pour ce
            navigateur — normal pour un .apk qui ne vient pas du Play Store).
          files: OmchaWatch/android/app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
