name: Build Morse Cosmos APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'MorseCosmos/www/**'
      - 'MorseCosmos/android/**'
      - 'MorseCosmos/package.json'
      - 'MorseCosmos/package-lock.json'
      - 'MorseCosmos/capacitor.config.json'
      - '.github/workflows/build-morsecosmos-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MorseCosmos/package-lock.json

      - name: Install dependencies
        working-directory: MorseCosmos
        run: npm ci

      - name: Install stable debug keystore
        # Même keystore de debug fixe que le build OmcVibe (cf. commentaire
        # là-bas) : signature stable d'un build à l'autre, pas de blocage
        # Android ni de conflit de signature en réinstallant par-dessus.
        run: |
          mkdir -p ~/.android
          cp .github/ci-debug.keystore ~/.android/debug.keystore

      - name: Sync Capacitor Android project
        working-directory: MorseCosmos
        run: npx cap sync android

      - name: Bump version (versionCode unique par build)
        # Même correctif que build-omchawatch-apk.yml : versionCode restait
        # figé à "1" sur tous les builds précédents, ce qu'Android refuse
        # de réinstaller par-dessus une version déjà présente (message
        # générique "App non installée"). Calé sur le numéro de run,
        # toujours strictement croissant.
        working-directory: MorseCosmos/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }} (${GITHUB_SHA::7})\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: MorseCosmos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorseCosmos-debug-apk
          path: MorseCosmos/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
