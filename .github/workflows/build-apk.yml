name: Build OmcVibe APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'OmcVibe/www/**'
      - 'OmcVibe/android/**'
      - 'OmcVibe/branding/**'
      - 'OmcVibe/package.json'
      - 'OmcVibe/package-lock.json'
      - 'OmcVibe/capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: OmcVibe/package-lock.json

      - name: Install dependencies
        working-directory: OmcVibe
        run: npm ci

      - name: Install stable debug keystore
        # Sans ça, le plugin Android Gradle génère un keystore de debug
        # ALÉATOIRE différent à chaque run (aucun ~/.android/debug.keystore
        # persistant sur un runner ubuntu-latest tout neuf) : chaque build
        # se retrouve signé par une clé jamais vue par Android, ce qui peut
        # déclencher un blocage strict côté téléphone ("Android ne reconnaît
        # pas cette application", pas même de proposition d'analyse Play
        # Protect) — en plus d'empêcher toute mise à jour propre par-dessus
        # une install existante (signatures différentes à chaque fois).
        # Un seul keystore de debug fixe, committé une fois pour toutes
        # (mêmes paramètres que le keystore de debug standard d'Android :
        # alias androiddebugkey, mot de passe "android", non secret par
        # nature), réutilisé à chaque run → même signature stable dans le
        # temps, comme un build local classique.
        run: |
          mkdir -p ~/.android
          cp .github/ci-debug.keystore ~/.android/debug.keystore

      - name: Sync Capacitor Android project
        working-directory: OmcVibe
        run: npx cap sync android

      - name: Build debug APK
        working-directory: OmcVibe/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmcVibe432-debug-apk
          path: OmcVibe/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
