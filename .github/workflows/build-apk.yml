name: Build OmcVibe APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'OmcVibe/www/**'
      - 'OmcVibe/android/**'
      - 'OmcVibe/branding/**'
      - 'OmcVibe/package.json'
      - 'OmcVibe/package-lock.json'
      - 'OmcVibe/capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write   # requis pour publier/mettre à jour la Release ci-dessous

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: OmcVibe/package-lock.json

      - name: Install dependencies
        working-directory: OmcVibe
        run: npm ci

      - name: Install stable debug keystore
        # Sans ça, le plugin Android Gradle génère un keystore de debug
        # ALÉATOIRE différent à chaque run (aucun ~/.android/debug.keystore
        # persistant sur un runner ubuntu-latest tout neuf) : chaque build
        # se retrouve signé par une clé jamais vue par Android, ce qui peut
        # déclencher un blocage strict côté téléphone ("Android ne reconnaît
        # pas cette application", pas même de proposition d'analyse Play
        # Protect) — en plus d'empêcher toute mise à jour propre par-dessus
        # une install existante (signatures différentes à chaque fois).
        # Un seul keystore de debug fixe, committé une fois pour toutes
        # (mêmes paramètres que le keystore de debug standard d'Android :
        # alias androiddebugkey, mot de passe "android", non secret par
        # nature), réutilisé à chaque run → même signature stable dans le
        # temps, comme un build local classique.
        run: |
          mkdir -p ~/.android
          cp .github/ci-debug.keystore ~/.android/debug.keystore

      - name: Sync Capacitor Android project
        working-directory: OmcVibe
        run: npx cap sync android

      - name: Build debug APK
        working-directory: OmcVibe/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmcVibe432-debug-apk
          path: OmcVibe/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # #201 : même correctif que build-omchawatch-apk.yml — un artefact
      # GitHub Actions exige d'être connecté à GitHub ET télécharge un
      # .zip (le navigateur mobile ne le décompresse jamais tout seul,
      # Android ne peut pas installer directement ce qu'il contient) ; il
      # expire aussi au bout de 30 jours. Une Release GitHub sert le .apk
      # BRUT (installable dès le téléchargement terminé) et ne périme
      # jamais. Tag toujours réécrit ("omcvibe-latest") : UN SEUL lien
      # stable à garder en favori, qui pointe toujours vers le dernier build.
      - name: Publish/update the "latest" Release with the raw APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omcvibe-latest
          name: "OmcVibe — dernière version (build ${{ github.run_number }})"
          body: |
            Build automatique le plus récent, depuis le commit ${{ github.sha }}.
            Télécharge directement le fichier `.apk` ci-dessous et installe-le
            (Android demandera peut-être d'autoriser "Sources inconnues" pour ce
            navigateur — normal pour un .apk qui ne vient pas du Play Store).
          files: OmcVibe/android/app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
